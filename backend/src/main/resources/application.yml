server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3390/volunteer_approval?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: volunteer
    password: volunteer@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6463
      timeout: 6000ms

logging:
  level:
    com.volunteer: DEBUG
    org.hibernate.SQL: DEBUG